<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Firebase Password Reset Tester</title>

<style>
body {
  font-family: Arial;
  background: #f4f4f9;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

.card {
  width: 450px;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  box-sizing: border-box;
}

button {
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

#log {
  margin-top: 15px;
  background: #111;
  color: #0f0;
  padding: 10px;
  min-height: 140px;
  white-space: pre-wrap;
  overflow-y: auto;
}
</style>

</head>

<body>

<div class="card">
  <h2>Password Reset Tester</h2>

  <input id="oob" placeholder="Paste oobCode">
  <input id="password" placeholder="New password">

<button id="btn">Reset Password</button>

  <div id="log"></div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  confirmPasswordReset
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBn0xJwd1RmrPGe81KZipL3iTssywUYW00",
  authDomain: "fbauth.viator.com",
  projectId: "api-project-518865853796"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const logBox = document.getElementById("log");

function log(msg) {
  console.log(msg);
  logBox.textContent += msg + "\n";
  logBox.scrollTop = logBox.scrollHeight;
}

log("Firebase loaded");

document.getElementById("btn").addEventListener("click", async () => {

  const oobCode = document.getElementById("oob").value.trim();
  const newPassword = document.getElementById("password").value;

  log("Button clicked");

  if (!oobCode) {
    log("ERROR: Missing oobCode");
    return;
  }

  if (newPassword.length < 6) {
    log("ERROR: Password too short");
    return;
  }

  try {

    log("Calling Firebase confirmPasswordReset...");

    await confirmPasswordReset(auth, oobCode, newPassword);

    log("SUCCESS: Password reset completed");

  } catch (err) {

    log("ERROR: " + (err.code || err.message));

    console.error(err);
  }

});

</script>

</body>
</html>
